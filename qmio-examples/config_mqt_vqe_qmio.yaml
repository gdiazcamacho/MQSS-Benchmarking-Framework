benchmark: core/mqt_bench/vqe_su2

benchmark_params:
  num_qubits: 2
  level: ALG

adapter: qmio_qiskit
backend: QMIO

calibration_file: /opt/cesga/qmio/hpc/calibrations/2026_03_13__12_00_01.json

shots: 200

output_dir: "./results_qmio"

# Controls what is generated
report:
  analysis:
    enabled: true
    visualization:
      enabled: true
      show: true

# Controls how results are persisted
storage:
  enabled: true
  type: "file"  # "file" or "sqlite"
  file:
    format: "json"
  sqlite:
    db_path: "./mqssbench.db"

profiling:
  enabled: false