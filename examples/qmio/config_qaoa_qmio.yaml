benchmark: core/native/qaoa

benchmark_params: # benchamark specific params
  num_qubits: 4
  edges:
    - [0, 1]
    - [1, 2]
    - [2, 3]
    - [3, 0]
  parameters: [0.5, 0.5, 0.5, 0.5]
  
adapter: qmio_qiskit
backend: QMIO

calibration_file: /opt/cesga/qmio/hpc/calibrations/2026_03_13__12_00_01.json

shots: 2048

output_dir: "./results_qmio"

# Controls what is generated
report:
  analysis:
    enabled: true
    visualization:
      enabled: true
      show: true

# Controls how results are persisted
storage:
  enabled: true
  type: "file"  # "file" or "sqlite"
  file:
    format: "json"
  sqlite:
    db_path: "./mqssbench.db"
  
profiling:
  enabled: false